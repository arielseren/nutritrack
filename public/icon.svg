<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d44"/>
      <stop offset="45%" stop-color="#006b5f"/>
      <stop offset="100%" stop-color="#0a2a26"/>
    </linearGradient>

    <!-- Teal Energy Ring Gradient -->
    <linearGradient id="tealRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62fae3"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#006b5f"/>
    </linearGradient>

    <!-- Amber Warm Accent Gradient -->
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#ffb783"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Background decorative circular grid ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Macro Progress Arc (Teal Primary Macro Arc) -->
  <path d="M 256 96 A 160 160 0 1 1 120 340" fill="none" stroke="url(#tealRing)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Energy Spark Accent Arc (Orange Tertiary Calorie Arc) -->
  <path d="M 148 376 A 160 160 0 0 1 230 98" fill="none" stroke="url(#amberAccent)" stroke-width="24" stroke-linecap="round"/>

  <!-- Stylized Nutrient Organic Leaf Center -->
  <g transform="translate(256, 256)">
    <!-- Main Leaf Body -->
    <path d="M 0 -85 C 65 -85 95 -20 85 55 C 75 95 35 105 0 105 C -35 105 -75 95 -85 55 C -95 -20 -65 -85 0 -85 Z" fill="#ffffff" opacity="0.96"/>
    
    <!-- Inner Leaf Vein Line -->
    <path d="M 0 -60 Q 5 20 -35 75" fill="none" stroke="#006b5f" stroke-width="10" stroke-linecap="round"/>
    <path d="M 2 -10 Q 30 15 45 40" fill="none" stroke="#006b5f" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

    <!-- Small Golden Nutrition Pulse Dot -->
    <circle cx="28" cy="-35" r="14" fill="url(#amberAccent)" filter="url(#glow)"/>
    <circle cx="28" cy="-35" r="7" fill="#ffffff"/>
  </g>
</svg>
